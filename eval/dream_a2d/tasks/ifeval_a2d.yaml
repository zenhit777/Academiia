# IFEval — fork Dream (lm_eval/tasks/ifeval/ifeval.yaml), avec deux adaptations :
#  1. dataset_path google/IFEval charge via la conversion parquet (refs/convert/parquet) :
#     le script de chargement d'origine est incompatible avec datasets>=2.16
#     (TypeError: must be called with a dataclass type or instance).
#  2. nom de tache distinct (ifeval_a2d) pour ne pas modifier le fork installe.
# Budget : max_gen_toks 1280 (= le budget publie par le fork, cf. A2D App. A.1).
task: ifeval_a2d
dataset_path: google/IFEval
dataset_name: null
dataset_kwargs:
  revision: refs/convert/parquet
output_type: generate_until
test_split: train
num_fewshot: 0
doc_to_text: prompt
doc_to_target: 0
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function utils.process_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 4.0
