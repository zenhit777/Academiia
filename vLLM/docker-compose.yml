# Inference Jainius via l'image vLLM officielle (support natif DiffusionGemma).
# Lancer depuis WSL : `cd vLLM && docker compose up`
# (Docker Desktop/Engine avec runtime NVIDIA requis, GPU visible via `nvidia-smi` sous WSL.)
#
# Image : le support DiffusionGemma (blog vLLM 2026-06-10, PR #45163) est
# fourni par le tag `gemma`, PAS par `latest` (non reproductible).
# Surcharger via VLLM_IMAGE uniquement pour tester une image plus recente.
#
# ENTRYPOINT de l'image : vllm/vllm-openai definit ENTRYPOINT ["vllm","serve"]
# (verifie via `docker image inspect <image> --format '{{json .Config.Entrypoint}}'`).
# Un `command:` en forme shell/liste serait donc CONCATENE a cet entrypoint, soit
# `vllm serve bash -c '...'` -> echec ("unrecognized arguments"). On neutralise
# l'entrypoint avec `entrypoint: ["bash","-c"]` et on fournit tout le script
# comme UN SEUL element de `command` (bash -c ne lit que le premier argument
# comme script ; les elements suivants deviendraient $0, $1... et seraient ignores).
#
# IMPORTANT (bug corrige en 686c5a8, ne pas reintroduire) : AUCUN backslash
# dans le bloc `>-`. Le repli YAML transforme les sauts de ligne en ESPACES :
# bash recevrait un backslash litteral suivi d'un espace, pas une continuation.
# Les instructions sont separees par des `;` en fin de ligne.

name: jainius-vllm

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:gemma}
    container_name: jainius-vllm
    # vLLM recommande `ipc: host` (ou shm_size eleve) pour les conteneurs.
    ipc: host
    # Neutralise le ENTRYPOINT ["vllm","serve"] de l'image : sans cette ligne,
    # le script ci-dessous serait passe comme argument a `vllm serve`.
    entrypoint: ["bash", "-c"]
    # Acces GPU (runtime NVIDIA sous WSL2).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      # Checkpoint Jainius local (lecture seule). Chemin HOTE vu depuis WSL.
      - "${VLLM_MODEL_HOST_PATH:-../checkpoints/Jainius}:/data/Jainius:ro"
      # Cache HF persistant (evite de re-telecharger tokenizer/configs).
      - vllm-hf-cache:/root/.cache/huggingface
    environment:
      # Optionnel : seulement pour contenus gates sur le Hub.
      - HF_TOKEN=${HF_TOKEN:-}
      # VLLM_WSL2_ENABLE_PIN_MEMORY=1 : reactive la memoire epinglee sous WSL2
      #   (desactivee par defaut sous WSL2), precondition d'UVA pour le runner
      #   V2. Variable introduite dans vLLM main ; a verifier dans l'image via
      #   ./diagnose_image.sh (peut y etre inconnue -> sans effet).
      - VLLM_WSL2_ENABLE_PIN_MEMORY=${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}
      # CUDA_LAUNCH_BLOCKING=0 : defaut (execution parallele). Mettre a 1 pour
      #   debug GPU : synchronise les lances CUDA, ralentit mais localise le
      #   crash reel (les erreurs CUDA sont asynchrones).
      - CUDA_LAUNCH_BLOCKING=${CUDA_LAUNCH_BLOCKING:-0}
      # VLLM_ENFORCE_EAGER=1 : desactive les CUDA graphs (--enforce-eager).
      #   Etait NECESSAIRE avec le runner V1 + offload CPU sous WSL2
      #   (test du 2026-10-18). Defaut 1 ; le flag n'est passe que si =1.
      - VLLM_ENFORCE_EAGER=${VLLM_ENFORCE_EAGER:-1}
      # Override runner V1 : NE PAS definir VLLM_USE_V2_MODEL_RUNNER ici
      #   (le runner V2 est le defaut de vLLM). Pour forcer le runner V1
      #   (DECONSEILLE : le test du 2026-10-18 a montre que la 1re generation
      #   plante avec une assertion GPU scatter/gather), definir dans .env :
      #     VLLM_USE_V2_MODEL_RUNNER_OVERRIDE=0
      - VLLM_USE_V2_MODEL_RUNNER_OVERRIDE=${VLLM_USE_V2_MODEL_RUNNER_OVERRIDE:-}
      # Allocation memoire PyTorch (configurable via .env).
      # Forme `${VAR-defaut}` (SANS « : ») : le defaut ne s'applique que si la
      # variable n'est PAS definie ; une valeur VIDE dans .env reste vide
      # (permet de desactiver `expandable_segments`, cf. experience E1 du
      # 2026-10-19). La forme `${VAR:-defaut}` re-mettrait le defaut des qu'une
      # valeur vide est presente dans .env -> la variable ne serait pas
      # desactivable.
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF-expandable_segments:True}
    # Pas de restart auto : un OOM doit se voir, pas boucler.
    restart: "no"
    # `$$` = littéral `$` pour le SHELL du conteneur (Compose interpole tout
    # `$VAR`/`${VAR}` AVANT ; seul `$$` lui échappe). Sont interpolés par
    # Compose (valeurs du .env) : ${VLLM_SERVED_MODEL_NAME:-jainius},
    # ${VLLM_DTYPE:-bfloat16}, ${VLLM_CPU_OFFLOAD_GB:-30},
    # ${VLLM_MAX_MODEL_LEN:-4096}, ${VLLM_MAX_NUM_SEQS:-1},
    # ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}, ${VLLM_ENFORCE_EAGER:-1},
    # ${VLLM_EXTRA_ARGS:-}. Sont lus par le shell : $$EAGER (interne),
    # $${VLLM_USE_V2_MODEL_RUNNER_OVERRIDE} (passe par environment:).
    command:
      - >-
        [ -n "$${VLLM_USE_V2_MODEL_RUNNER_OVERRIDE:-}" ] && export VLLM_USE_V2_MODEL_RUNNER="$$VLLM_USE_V2_MODEL_RUNNER_OVERRIDE" ;
        EAGER="" ;
        [ "${VLLM_ENFORCE_EAGER:-1}" = "1" ] && EAGER="--enforce-eager" ;
        exec vllm serve /data/Jainius --served-model-name "${VLLM_SERVED_MODEL_NAME:-jainius}" --host 0.0.0.0 --port 8000 --dtype "${VLLM_DTYPE:-bfloat16}" --cpu-offload-gb "${VLLM_CPU_OFFLOAD_GB:-30}" --max-model-len "${VLLM_MAX_MODEL_LEN:-4096}" --max-num-seqs "${VLLM_MAX_NUM_SEQS:-1}" --gpu-memory-utilization "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}" $${EAGER} ${VLLM_EXTRA_ARGS:-}
volumes:
  vllm-hf-cache:
