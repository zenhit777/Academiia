[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academiia"
version = "0.1.0"
description = "Academiia — espace de recherche A2D (AR-to-Diffusion Transfer)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Academiia contributors" },
]
keywords = ["diffusion", "language-model", "a2d", "lora", "ar-to-diffusion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "safetensors",
  "torch",
]

[project.optional-dependencies]
eval = [
  "huggingface_hub",
  "transformers",
  "pyyaml",
]
peft = [
  "peft",
]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/zenhit777/Academiia"
Repository = "https://github.com/zenhit777/Academiia"

# Points d'entree en ligne de commande (J10). Les scripts restent utilisables
# tels quels : `python modules/a2d/cli/merge_a2d.py ...`.
[project.scripts]
merge-a2d = "academiia.a2d.cli.merge_a2d:main"
verify-merge = "academiia.a2d.cli.verify_merge:main"
measure-geometry = "academiia.a2d.cli.measure_geometry:main"
verify-checkpoint = "academiia.a2d.cli.verify_checkpoint:main"
download-models = "academiia.a2d.cli.download_models:main"

# Paquets importables :
#   academiia.core -> code generique (stats, empreintes, E/S safetensors)
#   academiia.a2d  -> la methode A2D (mapping, sources, fusion, adaptateurs)
#   academiia.a2d.eval -> scripts d'evaluation (verdict G1, bootstrap, ...)
# Regle de dependance : modules -> core, jamais module -> module (ADR-001).
[tool.setuptools]
packages = [
  "academiia",
  "academiia.core",
  "academiia.a2d",
  "academiia.a2d.cli",
  "academiia.a2d.eval",
]
zip-safe = false
license-files = ["LICENSE"]
# Aucun fichier de donnees n'est embarque : les resultats de campagne
# (`modules/a2d/eval/dream_a2d*/`, ~9,4 Mo) restent dans le depot, hors wheel.
include-package-data = false

[tool.setuptools.package-dir]
academiia = "academiia"
"academiia.core" = "academiia/core"
"academiia.a2d" = "modules/a2d/a2d"
"academiia.a2d.cli" = "modules/a2d/cli"
"academiia.a2d.eval" = "modules/a2d/eval"

[tool.pytest.ini_options]
testpaths = ["tests", "modules/a2d/tests", "infra/vllm/scripts/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# Lint (J11, B1) : regles minimales E/F, alignees sur le plancher Python 3.12.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
# E501 (longueur de ligne) est non bloquant : le code existant n'est pas
# reformate en masse ; le reste (F401, F811, F841, E402...) est bloquant.
ignore = ["E501"]
